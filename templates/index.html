<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Model Maker</title>
  <!-- Using Google Fonts for a modern look -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>ML Model Maker</h1>
    <form action="/process" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="file">Upload CSV File:</label>
        <input type="file" name="file" id="file" required>
      </div>
      <div class="form-group">
        <label for="target">Target Column:</label>
        <input type="text" name="target" id="target" placeholder="Enter target variable" required>
      </div>
      <div class="form-group">
        <label for="task">Task Type:</label>
        <select name="task" id="task" required>
          <option value="classification">Classification</option>
          <option value="regression">Regression</option>
        </select>
      </div>
      <button type="submit" class="btn">Train Models</button>
    </form>
  </div>
</body>
</html>
